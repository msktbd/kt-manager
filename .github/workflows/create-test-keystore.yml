name: Create test keystore (one-time)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate TEST keystore (never committed)
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out
          PW="$(openssl rand -hex 16)"
          echo "::add-mask::$PW"
          ALIAS="kt-test"
          KS="$RUNNER_TEMP/kt-test.jks"
          keytool -genkeypair -storetype PKCS12 -keystore "$KS" \
            -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=KT Spike Test, O=Khurshed Traders, C=BD" \
            -storepass "$PW" -keypass "$PW" >/dev/null 2>&1

          base64 -w0 "$KS" > out/KT_TEST_KEYSTORE_B64.txt
          printf '%s' "$ALIAS" > out/KT_TEST_KEY_ALIAS.txt
          printf '%s' "$PW" > out/KT_TEST_KEYSTORE_PASSWORD.txt

          FP=$(keytool -list -v -keystore "$KS" -alias "$ALIAS" -storepass "$PW" 2>/dev/null \
                | grep -m1 'SHA256:' | awk '{print $2}')
          rm -f "$KS"
          {
            echo "### Test keystore created"
            echo "- Certificate SHA-256: \`$FP\`"
            echo "- Download the artifact, copy the 3 files into 3 repository secrets, then delete the artifact."
            echo "- Run this workflow only ONCE. A second run makes a different key."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: kt-test-keystore-ONE-TIME
          path: out/
          retention-days: 1
          if-no-files-found: error
