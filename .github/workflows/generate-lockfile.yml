name: Generate lockfile (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write # only to commit package-lock.json

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refuse to overwrite an existing lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo "::error::package-lock.json already exists. Dependencies are pinned; not regenerating."
            exit 1
          fi

      - name: Generate lockfile on Linux
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Verify the lockfile (npm ci + web build)
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package-lock.json (generated on CI)"
          git push
